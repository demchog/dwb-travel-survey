<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Travel Survey</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050d1f; color: #c0ddf0; font-family: 'Helvetica Neue', sans-serif; padding: 32px 24px; }

    h1 { font-size: 20px; color: #e0f0ff; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #4a7a9a; margin-bottom: 32px; }

    .stats { display: flex; gap: 20px; margin-bottom: 36px; flex-wrap: wrap; }
    .stat-card {
      background: #0c1a32; border: 1px solid #1b3060; border-radius: 12px;
      padding: 20px 28px; min-width: 160px;
    }
    .stat-card .value { font-size: 36px; font-weight: 700; color: #48dbfb; }
    .stat-card .label { font-size: 11px; color: #4a7a9a; text-transform: uppercase; letter-spacing: 0.6px; margin-top: 4px; }

    .section { margin-bottom: 40px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.8px; color: #5a9aba; margin-bottom: 14px; }

    .top-regions { display: flex; flex-direction: column; gap: 6px; max-width: 500px; }
    .bar-row { display: flex; align-items: center; gap: 10px; }
    .bar-label { font-size: 12px; color: #90c0e0; width: 200px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; background: #0c1a32; border-radius: 3px; height: 8px; }
    .bar-fill { height: 8px; border-radius: 3px; background: #1e90ff; transition: width 0.4s; }
    .bar-count { font-size: 11px; color: #4a7a9a; width: 28px; text-align: right; }

    .btn {
      background: #1e3a6e; border: 1px solid #2a5a9e; border-radius: 8px;
      color: #90c0e0; font-size: 13px; padding: 8px 20px; cursor: pointer;
      transition: all 0.2s; text-decoration: none; display: inline-block;
    }
    .btn:hover { background: #2a4a8e; color: #c0e8ff; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead th {
      text-align: left; padding: 8px 12px;
      color: #4a7a9a; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid #1b3060;
    }
    tbody tr { border-bottom: 1px solid #0c1a32; }
    tbody tr:hover { background: #0c1a32; }
    tbody td { padding: 9px 12px; color: #90c0e0; vertical-align: top; }
    td.id    { color: #3a6a8a; width: 40px; }
    td.name  { width: 140px; }
    td.home  { width: 180px; color: #c0ddf0; }
    td.time  { color: #3a6a8a; white-space: nowrap; }
    .tag {
      display: inline-block; background: #0e1e38; border: 1px solid #1b3060;
      border-radius: 4px; padding: 1px 6px; margin: 1px; font-size: 11px; color: #6090b0;
    }

    #refresh-note { font-size: 11px; color: #2a5a7a; margin-left: 12px; }
  </style>
</head>
<body>
  <h1>Travel Survey — Admin</h1>
  <p class="subtitle">Auto-refreshes every 30 seconds. <span id="refresh-note"></span></p>

  <div class="stats">
    <div class="stat-card"><div class="value" id="total">—</div><div class="label">Submissions</div></div>
    <div class="stat-card"><div class="value" id="regions-hit">—</div><div class="label">Regions reached</div></div>
  </div>

  <div class="section">
    <h2>Top regions</h2>
    <div class="top-regions" id="top-regions"></div>
  </div>

  <div class="section" style="display:flex;align-items:center;gap:16px;margin-bottom:16px;">
    <h2 style="margin:0">All submissions</h2>
    <a class="btn" href="/admin/export" download="travelers.json">⬇ Download travelers.json</a>
  </div>
  <table>
    <thead><tr>
      <th class="id">#</th>
      <th class="name">Name</th>
      <th class="home">Home region</th>
      <th>Visited regions</th>
      <th class="time">Submitted</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>

  <script>
    async function load() {
      const res = await fetch("/admin/data");
      if (!res.ok) { document.body.innerHTML = "<p style='color:#ff6b6b;padding:40px'>Session expired — refresh the page.</p>"; return; }
      const d = await res.json();

      document.getElementById("total").textContent = d.total;

      const uniqueRegions = new Set();
      d.submissions.forEach(s => { uniqueRegions.add(s.home_region); s.visited.forEach(v => uniqueRegions.add(v)); });
      document.getElementById("regions-hit").textContent = uniqueRegions.size;

      const maxCount = d.top_regions[0]?.count || 1;
      document.getElementById("top-regions").innerHTML = d.top_regions.map(r => `
        <div class="bar-row">
          <div class="bar-label" title="${r.name}">${r.name}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(r.count/maxCount*100).toFixed(1)}%"></div></div>
          <div class="bar-count">${r.count}</div>
        </div>`).join("");

      document.getElementById("tbody").innerHTML = d.submissions.map(s => `
        <tr>
          <td class="id">${s.id}</td>
          <td class="name">${s.name}</td>
          <td class="home">${s.home_region}</td>
          <td>${s.visited.map(v => `<span class="tag">${v}</span>`).join("")}</td>
          <td class="time">${s.submitted_at}</td>
        </tr>`).join("");

      document.getElementById("refresh-note").textContent = "Last updated: " + new Date().toLocaleTimeString();
    }

    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
